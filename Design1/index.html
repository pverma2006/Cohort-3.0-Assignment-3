<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Art Work</title>

    <link rel="stylesheet" href="style.css">

    <!-- Remix Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
        rel="stylesheet"
    >
</head>
<body>
    <main>
        <!-- Navigation Section -->
        <section id="section-1">
            <nav>
                <div class="left">
                    <h4>Explore Art Work</h4>
                </div>
                <div class="right">
                    <h4>See All</h4>
                </div>
            </nav>
        </section>


        <!-- Artwork Section -->
        <section id="section-2">

            <div class="boxes">

                <!-- Card 1 -->
                <div class="art-card">
                    <img src="img1.png" alt="Monocular artwork">

                    <div class="card-info">
                        <p>Monocular</p>

                        <div class="icon">
                            <p>54.8k</p>
                            <i class="ri-poker-hearts-line"></i>
                        </div>
                    </div>

                    <button>Place Bid</button>
                </div>


                <!-- Card 2 -->
                <div class="art-card">
                    <img src="img2.png" alt="Horns Mask artwork">

                    <div class="card-info">
                        <p>Horns Mask</p>

                        <div class="icon">
                            <p>32.4k</p>
                            <i class="ri-poker-hearts-line"></i>
                        </div>
                    </div>

                    <button>Place Bid</button>
                </div>


                <!-- Card 3 -->
                <div class="art-card">
                    <img src="img3.png" alt="Light Moon artwork">

                    <div class="card-info">
                        <p>Light Moon</p>

                        <div class="icon">
                            <p>86.6k</p>
                            <i class="ri-poker-hearts-line"></i>
                        </div>
                    </div>

                    <button>Place Bid</button>
                </div>


                <!-- Card 4 -->
                <div class="art-card">
                    <img src="img4.png" alt="Skull Wire artwork">

                    <div class="card-info">
                        <p>Skull Wire</p>

                        <div class="icon">
                            <p>78.9k</p>
                            <i class="ri-poker-hearts-line"></i>
                        </div>
                    </div>

                    <button>Place Bid</button>
                </div>


                <!-- Card 5 -->
                <div class="art-card">
                    <img src="img5.png" alt="Spiderman artwork">

                    <div class="card-info">
                        <p>Spiderman</p>

                        <div class="icon">
                            <p>24.8k</p>
                            <i class="ri-poker-hearts-line"></i>
                        </div>
                    </div>

                    <button>Place Bid</button>
                </div>


                <!-- Card 6 -->
                <div class="art-card">
                    <img src="img6.png" alt="DeadPool artwork">

                    <div class="card-info">
                        <p>DeadPool</p>

                        <div class="icon">
                            <p>59.7k</p>
                            <i class="ri-poker-hearts-line"></i>
                        </div>
                    </div>

                    <button>Place Bid</button>
                </div>


                <!-- Card 7 -->
                <div class="art-card">
                    <img src="img7.png" alt="White Eye artwork">

                    <div class="card-info">
                        <p>White Eye</p>

                        <div class="icon">
                            <p>45.7k</p>
                            <i class="ri-poker-hearts-line"></i>
                        </div>
                    </div>

                    <button>Place Bid</button>
                </div>


                <!-- Card 8 -->
                <div class="art-card">
                    <img src="img8.png" alt="Plastic Spinal artwork">

                    <div class="card-info">
                        <p>Plastic Spinal</p>

                        <div class="icon">
                            <p>98.6k</p>
                            <i class="ri-poker-hearts-line"></i>
                        </div>
                    </div>

                    <button>Place Bid</button>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
