<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <header>
        <nav>
          <img src="logo.png" alt="" />
          <div class="mid-nav">
            <a href="">About</a>
            <a href="">Watch now</a>
            <a href="">Actors</a>
            <a href="">Contact</a>
          </div>
          <i class="ri-menu-3-line"></i>
        </nav>
      </header>
      <section class="hero-1">
        <div class="image-logo">
          <img src="logo.png" alt="" />
        </div>
        <p>
          Action / Thriller I Drama Series directed by Dong-hyuk Hwang <br />
          Season 1: 9 Episodes
        </p>
        <div class="btn">
          <div class="btn1">
            <i class="ri-play-fill"></i>
            <p>Play Now</p>
          </div>
          <div class="btn2">
            <i class="ri-play-line"></i>
            <p>Watch Trailer</p>
          </div>
        </div>
      </section>
      <section class="hero-2">
        <img src="main.png" alt="" />
      </section>
      <section class="card">
        <div class="cards">
          <img src="img1.png" alt="" />
          <i class="ri-play-fill"></i>
        </div>
        <div class="cards">
          <img src="img2.png" alt="" />
          <i class="ri-play-fill"></i>
        </div>
        <div class="cards">
          <img src="img3.png" alt="" />
          <i class="ri-play-fill"></i>
        </div>
      </section>
    </main>
  </body>
</html>
